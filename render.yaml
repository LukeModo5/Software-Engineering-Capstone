services:
  - type: web
    name: techsupport-crud
    runtime: java
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/*.jar
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: STSpostgres
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: STSpostgres
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: STSpostgres
          property: password