<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <!-- Landing page for the user where they will submit a support request-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/form.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Support Requests</title>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="nav-brand" th:href="@{/createRequest}">
            <span class="logo">STS</span>
        </a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/createRequest}">Create Request</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/about}">About</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/viewRequests}">View Requests</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/login}">Technician Login</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/report}">Report</a>
                </li>
            </ul>
        </div>
        <form sec:authorize="isAuthenticated()" class="nav-logout-form" th:action="@{/logout}" method="post">
            <label class="form-label" style="color: #00ff0c; font-size: 10px;">Technician Logged In</label>
            <button class="nav-btn-logout" type="submit">Logout</button>
        </form>
    </div>
</nav>

<div class="form-wrapper">
    <div class="form-container">
        <form id="requestForm" th:action="@{/saveRequest}" th:object="${request}" method="post">
            <h2>Create a Support Request</h2>
            <input type="hidden" th:field="*{id}">

            <div class="col-sm-7">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" placeholder="Your name (first and last)" th:field="*{name}" required>
                <span class="error-message" th:errors="*{name}" style="color:red"></span>
            </div>
            <div class="col-sm">
                <label for="number" class="form-label">Phone Number</label>
                <input type="text" class="form-control" id="number" placeholder="1234567890" th:field="*{phoneNumber}" required>
                <span class="error-message" th:errors="*{phoneNumber}" style="color:red"></span>
            </div>
            <div class="col-sm-7">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="johndoe@gmail.com" th:field="*{email}" required>
                <span class="error-message" th:errors="*{email}" style="color:red"></span>
            </div>
            <div class="col-sm">
                <label for="device" class="form-label">Device Type</label>
                <select class="form-select" id="device" th:field="*{deviceType}" required>
                    <option value="">Select a device</option>
                    <option value="Smartphone">Smartphone</option>
                    <option value="Tablet">Tablet</option>
                    <option value="Computer">Computer</option>
                    <option value="Smart TV/TV">Smart TV/TV</option>
                    <option value="Internet/Wi-Fi">Internet/Wi-Fi</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="issue" class="form-label">Issue Description</label>
                <textarea id="issue" placeholder="Give a brief Description..." th:field="*{issueDescription}" required></textarea>
            </div>
            <div class="form-check mb-3">
                <span style="color: black; float: left">Urgent Request?</span>
                <input type="checkbox" id="urgent" th:field="*{urgent}" style="width: 16px; height: 16px; margin: 0;">
                <label for="urgent" style="color: black; margin: 0;">Yes</label>
            </div>

            <div style="text-align: center">
                <button class="btn btn-primary" type="submit" style="text-align: center;">Submit Request</button>
            </div>

            <p style="color: black" th:text="${message}"></p>
        </form>
    </div>
</div>

<footer class="site-footer">
    <div class="footer-content">
        <span class="footer-logo">STS</span>
        <p class="footer-tagline">Support Ticket System</p>
        <p class="footer-copy">&copy; 2026 STS. All rights reserved.</p>
    </div>
</footer>

</body>
</html>
