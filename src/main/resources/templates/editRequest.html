<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <!--Technician only page to edit a support request-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--<link rel="stylesheet" th:href="@{/css/navbar.css}">-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/form.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Title</title>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="nav-brand" th:href="@{/createRequest}">
            <span class="logo">STS</span>
        </a>
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/createRequest}">Create Request</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/about}">About</a>
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <a class="nav-link" th:href="@{/viewRequests}">View Requests</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/login}">Technician Login</a>
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <a class="nav-link" th:href="@{/report}">Report</a>
            </li>
        </ul>
        <form sec:authorize="isAuthenticated()" class="nav-logout-form" th:action="@{/logout}" method="post">
            <label class="form-label" style="color: #00ff0c; font-size: 10px;">Technician Logged In</label>
            <button class="nav-btn-logout" type="submit">Logout</button>
        </form>
    </div>
</nav>
<div class="form-wrapper">
    <div class="form-container">
        <form th:action="@{/editSaveRequest}" th:object="${request}" method="post">
            <h2 style="text-align: center;">Edit Support Request</h2>
            <input type="hidden" th:field="*{id}">

            <div class="col-sm-7">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" th:field="*{name}" required readonly>
            </div>
            <div class="col-sm">
                <label for="number" class="form-label">Phone Number</label>
                <input type="text" class="form-control" id="number" th:field="*{phoneNumber}" required readonly>
            </div>
            <div class="col-sm-7">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" th:field="*{email}" readonly>
            </div>
            <div class="col-sm">
                <label class="form-label">Device Type</label>
                <input type="text" class="form-control" th:field="*{deviceType}" readonly>
            </div>
            <div class="mb-3">
                <label for="issue" class="form-label">Issue Description</label>
                <textarea id="issue" th:field="*{issueDescription}" required readonly></textarea>
            </div>
            <div class="form-check mb-3" style="display: flex; align-items: center; gap: 8px; padding-left: 4px;">
                <span style="color: black;">Urgent Request?</span>
                <input type="checkbox" id="urgent" th:field="*{urgent}" style="width: 16px; height: 16px; margin: 0;" disabled>
                <label for="urgent" style="color: black; margin: 0;">Yes</label>
            </div>
            <div class="col-sm">
                <label class="form-label">Status</label>
                <select class="form-select" th:field="*{status}">
                    <option value="Open">Open</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Closed">Closed</option>
                </select>
            </div>

            <div style="text-align: center;">
                <button class="btn btn-primary" type="submit" style="margin: 10px">Update Request</button>
            </div>

            <p th:text="${message}"></p>
        </form>
    </div>
</div>

<footer class="site-footer">
    <div class="footer-content">
        <span class="footer-logo">STS</span>
        <p class="footer-tagline">Support Ticket System</p>
        <p class="footer-copy">&copy; 2026 STS. All rights reserved.</p>
    </div>
</footer>

</body>
</html>
