<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/form.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>View Requests</title>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="nav-brand" th:href="@{/createRequest}">
            <span class="logo">STS</span>
        </a>
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/createRequest}">Create Request</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/about}">About</a>
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <a class="nav-link active" th:href="@{/viewRequests}">View Requests</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/login}">Technician Login</a>
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <a class="nav-link" th:href="@{/report}">Report</a>
            </li>
        </ul>
        <form sec:authorize="isAuthenticated()" class="nav-logout-form" th:action="@{/logout}" method="post">
            <label class="form-label" style="color: #00ff0c; font-size: 10px;">Technician Logged In</label>
            <button class="nav-btn-logout" type="submit">Logout</button>
        </form>
    </div>
</nav>

<form class="search-form" th:action="@{/searchRequests}" method="get">
    <input type="text" name="keyword" th:value="${keyword}" placeholder="Search by customer name">
    <button class="btn btn-primary" type="submit">Search</button>
    <a class="btn btn-primary" th:href="@{/viewRequests}">Clear Search</a>
</form>

<div style="margin: 0 auto;" class="request-table">
    <table class="table table-dark table-hover table-striped" border="1">
        <thead>
        <tr>
        <tr>
            <th scope="col">Customer Name</th>
            <th scope="col">Phone Number</th>
            <th scope="col">Email</th>
            <th scope="col">Device Type</th>
            <th scope="col">Description</th>
            <th scope="col">Status</th>
            <th scope="col">Date/Time Created</th>
            <th scope="col">Urgent?</th>
            <th scope="col">Actions</th>
        </tr>
        </thead>
        <tbody class="table table-striped">
        <tr th:each="request : ${reqList}">
            <td th:text="${request.name}"></td>
            <td th:text="${request.phoneNumber}"></td>
            <td th:text="${request.email}"></td>
            <td th:text="${request.deviceType}"></td>
            <td class="description-cell" th:text="${request.issueDescription}"></td>
            <td>
                <form th:action="@{/editStatus}" method="post">
                    <input type="hidden" name="id" th:value="${request.id}">
                    <select name="status" onchange="this.form.submit()">
                        <option th:selected="${request.status == 'Open'}" value="Open">Open</option>
                        <option th:selected="${request.status == 'In Progress'}" value="In Progress">In Progress</option>
                        <option th:selected="${request.status == 'Closed'}" value="Closed">Closed</option>
                    </select>
                </form>
            </td>
            <td th:text="${#temporals.format(request.getDateCreated(), 'MM/dd/yyyy HH:mm')}"></td>
            <td th:text="${request.urgent} ? 'Yes' : 'No'"></td>
            <td>
                <a th:href="@{/deleteRequest/{id}(id=${request.id})}" class="btn-link">Delete</a>
                <a th:href="@{/editRequest/{id}(id=${request.id})}" class="btn-link">Update</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<p style="color: white; margin: 0 auto; display: flex; align-items: center; justify-content: center;" th:text="${message}"></p>

<script></script>

<footer class="site-footer">
    <div class="footer-content">
        <span class="footer-logo">STS</span>
        <p class="footer-tagline">Support Ticket System</p>
        <p class="footer-copy">&copy; 2026 STS. All rights reserved.</p>
    </div>
</footer>

</body>
</html>
