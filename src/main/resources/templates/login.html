<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/form.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Technician Login</title>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="nav-brand" th:href="@{/createRequest}">
            <span class="logo">STS</span>
        </a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/createRequest}">Create Request</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/about}">About</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/viewRequests}">View Requests</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/login}">Technician Login</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/report}">Report</a>
                </li>
            </ul>
        </div>
        <form sec:authorize="isAuthenticated()" class="nav-logout-form" th:action="@{/logout}" method="post">
            <button class="nav-btn-logout" type="submit">Logout</button>
        </form>
    </div>
</nav>



<div class="form-wrapper">
    <div class="form-container">
        <form class="login-form" th:action="@{/login}" method="post">
            <h2>Technician Login</h2>
            <div class="col-sm-7">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control" required>
            </div>
            <div class="col-sm-7">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <div th:if="${param.error}" style="color:red">
                <p>Invalid username or password</p>
            </div>
            <button class="btn btn-primary" type="submit" style="margin-top: 5px">Login</button>
        </form>
    </div>
</div>

<footer class="site-footer">
    <div class="footer-content">
        <span class="footer-logo">STS</span>
        <p class="footer-tagline">Support Ticket System</p>
        <p class="footer-copy">&copy; 2026 STS. All rights reserved.</p>
    </div>
</footer>

</body>
</html>
